# Every credential this repo's pipelines use: where it lives, what it can do, when it expires and who
# renews it. NEVER a value. Rules: AGENTS.md "Configuration and secrets"; process: docs/operations.md.
#
# expires: a date (YYYY-MM-DD), never, or unknown. "unknown" is a finding: look it up where the credential
# was made and write the date here. Renew at least 14 days before the date; the digest warns from 30 days
# (SEV3) and 7 days (SEV2).

credentials:
  - name: dental-omop-ci
    what: OAuth secret of the CI service principal that deploys the bundle
    made_in: Databricks -> Settings -> Identity and access -> Service principals -> dental-omop-ci -> Secrets
    scope: all-apis
    stored_in: GitHub environment secret DATABRICKS_CLIENT_SECRET (dev, uat, prod each have their own)
    used_by: .github/workflows/deploy.yml, auth_check.yml
    lifetime: up to 730 days, set when made (Databricks maximum)
    expires: unknown
    owner: repo owner
    if_it_expires: deploys fail at sign-in; merges to main stop reaching dev. Make a new secret, replace the GitHub secret, run the login check workflow.

  - name: Workspace personal access token
    what: admin setup, and the coding agent's read access to job runs and their errors (token comment "claude")
    made_in: Databricks -> Settings -> Developer -> Access tokens
    scope: all-apis
    stored_in: cloud environment variable DATABRICKS_TOKEN (the agent's environment; a new value takes effect in a new session)
    used_by: databricks/setup/create_service_principal.sh; agent sessions checking runs (jobs/runs, get-output)
    lifetime: 15 days at most; revoke when not needed
    expires: 2026-11-11
    owner: repo owner
    if_it_expires: the agent can no longer read run outputs or start jobs; CI deploys are unaffected (they use dental-omop-ci)

  - name: gh login
    what: GitHub CLI login used to set repository secrets and variables
    made_in: gh auth login
    scope: repo (classic), or fine-grained this repo with Secrets, Variables and Environments read and write
    stored_in: your laptop only
    used_by: people, when setting secrets
    lifetime: as chosen when made
    expires: unknown
    owner: repo owner
    if_it_expires: gh secret set fails; log in again

  - name: Hugging Face token
    what: read token for MedGemma (Health AI Developer Foundations terms accepted)
    made_in: huggingface.co -> Settings -> Access tokens (Read)
    scope: read
    stored_in: Databricks secret scope health_transformation_lab, key hf_token; Kaggle notebook secret HF_TOKEN
    used_by: MedGemma reader job (notebook 03), kaggle/medgemma_reader.ipynb
    lifetime: 7 days recommended for runs. The token in Databricks ("databricks-medgemma", made 2026-11-01 after the
      old one was refused with 401) has no expiry set on Hugging Face; delete it there when the reader runs are done
    expires: unknown
    owner: repo owner
    if_it_expires: the MedGemma reader job stops in its first cell, naming HF_TOKEN (llm_reader.check_hf_access, #230)

  - name: Application Insights connection string
    what: lets the pipelines send telemetry (spec 014); can't read anything
    made_in: Azure portal -> Application Insights health-transformation-lab-nlp-appi, or terraform output connection_string
    scope: ingestion only
    stored_in: Databricks secret scope health_transformation_lab, key appinsights_connection_string
    used_by: telemetry.use_databricks_secret in the pipeline notebooks
    lifetime: does not expire; rotate by recreating the resource
    expires: never
    owner: repo owner
    if_it_expires: n/a; if it's wrong, telemetry turns itself off with a warning (missing secret never fails a pipeline)

  - name: Kaggle API token
    what: lets the kaggle-medgemma and kaggle-encoders workflows push their notebooks and read status and outputs
    made_in: kaggle.com -> Settings -> API -> Generate New Token
    scope: the Kaggle account (Kaggle offers no narrower scope)
    stored_in: GitHub environment dev, secret KAGGLE_API_TOKEN (or KAGGLE_KEY)
    used_by: .github/workflows/kaggle-medgemma.yml, .github/workflows/kaggle-encoders.yml, .github/workflows/kaggle-publish.yml
    lifetime: as shown on Kaggle when made
    expires: unknown
    owner: repo owner
    if_it_expires: each workflow's credential check fails with instructions

  - name: Hugging Face publish token
    what: publishes the PerioBench datasets and the organisation page to huggingface.co/healthtransformationlab (spec 025)
    made_in: huggingface.co -> Settings -> Access tokens -> Create new token -> Fine-grained
    scope: fine-grained; Repositories, write access to the healthtransformationlab organisation's repositories (nothing else, no personal repositories)
    stored_in: GitHub environment dev, secret HF_PUBLISH_TOKEN; when that is unset the workflow uses the secret HF_TOKEN instead (issue #249), which then needs this scope. In use since 2026-10-29 (#267) - the fine-grained token named "Claude", saved as HF_TOKEN (HF_PUBLISH_TOKEN unset), with read, create and write access to the organisation's repositories
    used_by: .github/workflows/kaggle-publish.yml (the huggingface job)
    lifetime: 90 days at most; delete it on Hugging Face when not publishing. The token in use ("Claude", created 2026-10-26) has no expiry set on Hugging Face, so replace it by 2027-01-24 with one that expires
    expires: never
    owner: repo owner
    if_it_expires: the workflow's token check fails before any work, naming HF_PUBLISH_TOKEN. Make a new token, replace the secret, rerun.

  - name: Website push token
    what: lets the copy-decks-to-site workflow commit the decks and their covers to the website repository (issue #374)
    made_in: github.com -> Settings -> Developer settings -> Personal access tokens -> Fine-grained tokens -> Generate new token (resource owner healthtransformationlab)
    scope: fine-grained; Repository access, only the website repository healthtransformationlab.github.io (organisation healthtransformationlab); Repository permissions, Contents read and write (GitHub adds Metadata read); nothing else
    stored_in: GitHub repository secret SITE_PUSH_TOKEN (this repository)
    used_by: .github/workflows/copy-decks-to-site.yml
    lifetime: 90 days at most. Not created yet; when it is made, write its expiry date in expires
    expires: unknown
    owner: repo owner
    if_it_expires: the workflow's token check fails before any work, naming SITE_PUSH_TOKEN, and deck changes stop reaching the site. Make a new token, replace the secret, run the workflow by hand.
