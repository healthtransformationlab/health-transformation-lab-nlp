# What a coding-agent task costs (spec 036 US2, #569): each setting declared once, with its value, its source and
# the date it was read (AGENTS.md "Configuration and secrets"). A change is a pull request that updates the date.
# Every cost these give is an ESTIMATE: Kaggle's GPUs are free to us, and the price is what the same GPU time would
# cost on a cloud, not anything paid.

# Kaggle counts a GPU session's time against a weekly allowance, whatever its GPUs (a 2x T4 session hour is one
# hour of allowance). About 30 hours, and it varies by week; Kaggle shows the current figure on the account's
# settings page, and third-party guides disagree on when it resets.
kaggle_weekly_allowance_hours:
  value: 30
  source: https://www.kaggle.com/docs/notebooks
  read_date: "2026-11-04"

# One T4 GPU-hour on a cloud: the median on-demand price across providers listed on Oct 26, 2026.
t4_usd_per_gpu_hour:
  value: 0.69
  source: https://getdeploying.com/gpus/nvidia-t4
  read_date: "2026-11-04"

# One L4 GPU-hour on a cloud: the median on-demand price across providers for the week of Oct 26, 2026, the same
# week, figure and source as the T4's (the source's weekly series: 0.8319 across 14 providers that week, and 0.8363
# across 18 in the week of Nov 9). The runs under the competition's evaluator used four L4s.
l4_usd_per_gpu_hour:
  value: 0.83
  source: https://getdeploying.com/gpus/nvidia-l4
  read_date: "2026-11-11"

# One A100 GPU-hour on a cloud: the same source, week (Oct 26, 2026) and figure as the T4's and the L4's: the median
# on-demand price across providers, 1.8675 across 38 that week (1.8925 across 38 in the week of Nov 9). The source
# has one series for the A100, 40 GB and 80 GB together. The Colab pair of November 12 ran on one A100 40 GB
# (#687); Colab itself is paid in compute units, so this is still an estimate of what the GPU time would rent for.
a100_usd_per_gpu_hour:
  value: 1.87
  source: https://getdeploying.com/gpus/nvidia-a100
  read_date: "2026-11-12"
