# Jobs deployed to every target. Notebook tasks without a cluster run on
# serverless compute (the only option on Free Edition); the GPU jobs below ask
# for a serverless GPU per task (compute.hardware_accelerator).

resources:
  jobs:
    study_benchmark:
      name: Benchmark
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        - task_key: build_and_benchmark
          notebook_task:
            notebook_path: ../notebooks/01_run_benchmark.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              catalog: ${resources.schemas.perio_bench_gold.catalog_name}
              schema: ${resources.schemas.perio_bench_gold.name}
              landing_schema: ${resources.volumes.perio_bench_data.schema_name}
              n_people: ${var.n_people}
              run_encoder: ${var.run_encoder}
              leak_assessment: "false"
              experiment_id: ${resources.experiments.dental_experiment.id}

    load_lakebase:
      name: Load Lakebase
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        - task_key: load
          notebook_task:
            notebook_path: ../notebooks/04_load_lakebase.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              lakebase_instance: ${var.lakebase_instance}
              lakebase_database: ${var.lakebase_database}
              lakebase_schema: ${var.lakebase_schema}
              secret_scope: ${var.hf_secret_scope}

    judge_scorecard:
      name: Judge scorecard
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        - task_key: scorecard
          notebook_task:
            notebook_path: ../notebooks/07_judge_scorecard.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              catalog: ${resources.schemas.perio_bench_gold.catalog_name}
              schema: ${resources.schemas.perio_bench_gold.name}
              judge_endpoint: ${var.judge_endpoint}
              experiment_id: ${resources.experiments.dental_experiment.id}
              usd_per_million_in: ${var.judge_usd_per_million_in}
              usd_per_million_out: ${var.judge_usd_per_million_out}
              max_usd: "5"

    llm_judge:
      name: LLM judge
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        - task_key: judge
          notebook_task:
            notebook_path: ../notebooks/02_llm_judge.sql
            warehouse_id: ${var.warehouse_id}
            base_parameters:
              catalog: ${resources.schemas.perio_bench_gold.catalog_name}
              schema: ${resources.schemas.perio_bench_gold.name}
              judge_endpoint: ${var.judge_endpoint}

    # GPU jobs on serverless GPU (Free Edition has it; one A10 by default, var.gpu_accelerator).
    # Run on demand: no schedule.
    medgemma_reader:
      name: MedGemma reader
      max_concurrent_runs: 2   # a new run starts even while an old one waits hours to retry
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      environments:          # required with task-level compute on serverless
        - environment_key: gpu
          spec:
            environment_version: ${var.gpu_environment_version}
      tasks:
        - task_key: read_notes
          environment_key: gpu
          max_retries: 6                    # serverless GPU can fail to start (no GPU free) or to restart Python;
          min_retry_interval_millis: 1800000  # 30 min apart, so a run keeps trying for ~4.5 hours
          retry_on_timeout: true
          compute:
            hardware_accelerator: ${var.gpu_accelerator}
          notebook_task:
            notebook_path: ../notebooks/03_medgemma_reader.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              catalog: ${resources.schemas.perio_bench_gold.catalog_name}
              schema: ${resources.schemas.perio_bench_gold.name}
              rung: ${var.reader_rung}
              limit: ${var.reader_limit}
              shots: ${var.reader_shots}
              lora_train: ${var.reader_lora_train}
              hf_secret_scope: ${var.hf_secret_scope}
              telemetry: ${var.telemetry_exporter}
              experiment_name: ${resources.experiments.dental_experiment.name}
              run_id: "{{job.run_id}}"   # batch key for its Delta rows: the same for every retry of this run

    encoder_gpu:
      name: Encoders on GPU
      max_concurrent_runs: 2   # a new run starts even while an old one waits hours to retry
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      environments:          # required with task-level compute on serverless
        - environment_key: gpu
          spec:
            environment_version: ${var.gpu_environment_version}
      tasks:
        - task_key: fine_tune_and_predict
          environment_key: gpu
          max_retries: 6                    # serverless GPU can fail to start (no GPU free) or to restart Python;
          min_retry_interval_millis: 1800000  # 30 min apart, so a run keeps trying for ~4.5 hours
          retry_on_timeout: true
          compute:
            hardware_accelerator: ${var.gpu_accelerator}
          notebook_task:
            notebook_path: ../notebooks/08_encoder_gpu.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              rungs: ${var.encoder_gpu_rungs}
              lr_overrides: ${var.encoder_gpu_lr}
              catalog: ${resources.schemas.perio_bench_gold.catalog_name}
              schema: ${resources.schemas.perio_bench_gold.name}
              landing_schema: ${resources.volumes.perio_bench_data.schema_name}
              telemetry: ${var.telemetry_exporter}

    # De-identification methods that need Databricks services (spec 007 T012b, T016): the LLM via a
    # serving endpoint and ai_mask via the SQL warehouse. Serverless CPU; results to the landing volume.
    deid_ai:
      name: De-id AI methods
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        - task_key: score
          notebook_task:
            notebook_path: ../notebooks/06_deid_benchmark.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              engines: ${var.deid_ai_engines}
              llm_endpoint: ${var.deid_llm_endpoint}
              sql_warehouse_id: ${var.warehouse_id}
              save_to_repo: "no"
              out_dir: /Volumes/${resources.volumes.perio_bench_data.catalog_name}/${resources.volumes.perio_bench_data.schema_name}/${resources.volumes.perio_bench_data.name}/deid_ai

    # NHANES 2009-2014 periodontal exam (spec 013 G4): public-domain CDC files, downloaded here because
    # cdc.gov isn't reachable from every environment. Raw files and the aggregate table stay on the volume.
    nhanes_perio:
      name: NHANES perio
      tags:
        project: health-transformation-lab-nlp
        data: public
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        - task_key: prevalence
          notebook_task:
            notebook_path: ../notebooks/09_nhanes_perio.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              data_dir: /Volumes/${resources.volumes.perio_bench_data.catalog_name}/${resources.volumes.perio_bench_data.schema_name}/${resources.volumes.perio_bench_data.name}/nhanes_raw
              out_dir: /Volumes/${resources.volumes.perio_bench_data.catalog_name}/${resources.volumes.perio_bench_data.schema_name}/${resources.volumes.perio_bench_data.name}/nhanes
              telemetry: ${var.telemetry_exporter}

    # Spec 029 (T007; #369, #370, #381): the seeded synthetic Open Dental extract, generated into the landing volume
    # and loaded to bronze (as generated) and silver (cleaned, plus the evaluation-only answer key). Every table is
    # overwritten per run. deploy.yml starts it when the bronze tables don't exist yet; run it by hand after a
    # generator change. Serverless CPU.
    open_dental_load:
      name: Load Open Dental
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        - task_key: load
          notebook_task:
            notebook_path: ../notebooks/12_load_open_dental.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              run_id: "{{job.run_id}}"
              od_catalog: ${resources.schemas.opendental_perio_bronze.catalog_name}
              bronze_schema: ${resources.schemas.opendental_perio_bronze.name}
              silver_schema: ${resources.schemas.opendental_perio_silver.name}
              landing_dir: /Volumes/${resources.volumes.opendental_perio_data.catalog_name}/${resources.volumes.opendental_perio_data.schema_name}/${resources.volumes.opendental_perio_data.name}
              seed: "42"
              n_patients: "2000"

    # Spec 016: every committed model result (Kaggle runs collected into a PR, laptop runs) into the gold
    # tables, next to what the Databricks jobs write. deploy.yml starts it after every deploy; loading again
    # adds nothing. Serverless CPU.
    load_results:
      name: Load results
      tags:
        project: health-transformation-lab-nlp
        data: synthetic
        git_commit: ${bundle.git.commit}   # the commit this job was deployed from
      tasks:
        # spec 018: copy tables still under their old names to the new ones first; does nothing once done
        - task_key: migrate_gold_names
          notebook_task:
            notebook_path: ../notebooks/11_migrate_gold_names.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              catalog: ${resources.schemas.perio_bench_gold.catalog_name}
              schema: ${resources.schemas.perio_bench_gold.name}
              legacy_gold_schemas: ${var.legacy_gold_schemas}   # issue #228: rows only an old schema still holds
        - task_key: load
          depends_on:
            - task_key: migrate_gold_names
          notebook_task:
            notebook_path: ../notebooks/10_load_results.py
            base_parameters:
              git_commit: ${bundle.git.commit}   # shown on every run
              catalog: ${resources.schemas.perio_bench_gold.catalog_name}
              schema: ${resources.schemas.perio_bench_gold.name}
              experiment_name: ${resources.experiments.dental_experiment.name}
