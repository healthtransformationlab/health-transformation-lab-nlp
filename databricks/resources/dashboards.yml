# AI/BI dashboard (spec 012): Phenotyping and De-identification pages over the gold tables the
# judge_scorecard job writes. Same name in every target (each target is its own workspace).
resources:
  dashboards:
    scorecard:
      display_name: Scorecard
      file_path: ../dashboards/scorecard.lvdash.json
      warehouse_id: ${var.warehouse_id}
    # The two graders (spec 019), built by python/scripts/42_build_dashboards.py; never edit the JSON by hand.
    dq_grader:
      display_name: EHR DQ grader
      file_path: ../dashboards/dq_grader.lvdash.json
      warehouse_id: ${var.warehouse_id}
    lab_grader:
      display_name: Lab grader
      file_path: ../dashboards/lab_grader.lvdash.json
      warehouse_id: ${var.warehouse_id}
    # Spec 027 US5: the pipeline doctor's signals and decisions, same builder; empty until the job has run.
    pipeline_doctor_dashboard:   # the job is pipeline_doctor; bundle keys are unique across resource types
      display_name: Pipeline doctor
      file_path: ../dashboards/pipeline_doctor.lvdash.json
      warehouse_id: ${var.warehouse_id}
