# Run the MedGemma reader on a free Kaggle GPU (kaggle/medgemma_reader.ipynb), for when Databricks
# Free Edition has no GPU. Start it from the Actions tab: "Run MedGemma on a free Kaggle GPU" -> Run workflow.
#
# Needs, in the GitHub environment `dev`: KAGGLE_USERNAME (variable or secret) and either KAGGLE_API_TOKEN
# or KAGGLE_KEY (secret). No Hugging Face token: a pushed notebook can't read Kaggle Secrets, so MedGemma is
# attached from Kaggle Models (models.yaml `kaggle:`, kernel-metadata.json model_sources) and converted there.
name: Run MedGemma on a free Kaggle GPU
run-name: "MedGemma on Kaggle: ${{ inputs.rung }}, ${{ inputs.limit == '0' && 'all review notes' || format('{0}-note test', inputs.limit) }}${{ inputs.collect_only && ' (collect results only)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Review notes to read: 10 for a test, 0 for every review note (a few hours: set wait off)"
        default: "10"
      shots:
        description: "Few-shot examples per status (0 = zero-shot)"
        default: "0"
      rung:
        description: "MedGemma version (models.yaml)"
        default: medgemma-1.5-4b-it
      branch:
        description: "Branch the notebook clones (empty: the one picked in \"Use workflow from\", at this run's commit)"
        default: ""
      wait:
        description: "Wait for Kaggle to finish and keep the outputs as an artifact"
        type: boolean
        default: true
      collect_only:
        description: "Don't run: only download the outputs of the last Kaggle run"
        type: boolean
        default: false
      open_pr:
        description: "Open a pull request that commits the results (a full run; a smaller test run is never committed)"
        type: boolean
        default: true

concurrency: kaggle-medgemma

jobs:
  run:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 350
    permissions:
      contents: write          # push the results branch
      pull-requests: write     # open the PR (spec 016)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --quiet "kaggle==2.2.5" six pyyaml   # pyyaml: prepare_kernel.py reads models.yaml

      - name: Kaggle credentials (values stay masked)
        env:
          U: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
          T: ${{ secrets.KAGGLE_API_TOKEN }}
          K: ${{ secrets.KAGGLE_KEY }}
        run: |
          [ -n "$U" ] || { echo "::error::KAGGLE_USERNAME is not set in the GitHub environment 'dev' (variable or secret)"; exit 1; }
          echo "KAGGLE_USERNAME=$U" >> "$GITHUB_ENV"
          # Kaggle's "Generate New Token" makes an API token (KAGGLE_API_TOKEN); older accounts have a legacy key
          # (KAGGLE_KEY). A token saved under KAGGLE_KEY works too: the CLI tries it as a token first and falls
          # back to username + key if Kaggle doesn't recognise it.
          tok="${T:-$K}"
          [ -n "$tok" ] || { echo "::error::Set KAGGLE_API_TOKEN (or KAGGLE_KEY) in the GitHub environment 'dev'"; exit 1; }
          echo "KAGGLE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          [ -n "$K" ] && echo "KAGGLE_KEY=$K" >> "$GITHUB_ENV"
          echo "KERNEL=$U/perio-bench-medgemma-reader" >> "$GITHUB_ENV"

      - name: Check Kaggle accepts the credentials
        run: |
          kaggle kernels list --mine --page-size 1 >/dev/null 2>err.txt || {
            cat err.txt | head -5
            echo "::error::Kaggle rejected the credentials. Kaggle -> Settings -> API -> Generate New Token, save it as the secret KAGGLE_API_TOKEN in the GitHub environment 'dev', and check KAGGLE_USERNAME is your Kaggle username (the name in kaggle.com/<username>), not your email."
            exit 1; }
          echo "Kaggle accepted the credentials"

      - name: Prepare the notebook
        if: ${{ !inputs.collect_only }}
        run: >
          python kaggle/prepare_kernel.py --out build/kernel --username "$KAGGLE_USERNAME"
          --rung "${{ inputs.rung }}" --shots "${{ inputs.shots }}" --limit "${{ inputs.limit }}"
          --branch "${{ inputs.branch || github.ref_name }}"
          --commit "${{ (inputs.branch == '' || inputs.branch == github.ref_name) && github.sha || '' }}"

      - name: Push and run it on Kaggle (GPU T4 x2)
        if: ${{ !inputs.collect_only }}
        run: kaggle kernels push -p build/kernel --accelerator NvidiaTeslaT4

      - name: Wait for Kaggle to finish
        if: ${{ inputs.wait || inputs.collect_only }}
        run: |
          for i in $(seq 1 330); do
            s=$(kaggle kernels status "$KERNEL" 2>&1); echo "$(date -u +%H:%M) $s"
            case "${s,,}" in
              *complete*) exit 0 ;;
              *error*|*cancel*) echo "::error::Kaggle run did not finish: $s"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::still running after 330 minutes; run again later with collect_only"; exit 1

      - name: Download the outputs and the log
        if: ${{ always() && (inputs.wait || inputs.collect_only) }}
        run: |
          mkdir -p build/output
          kaggle kernels output "$KERNEL" -p build/output || true
          ls -la build/output
          log=$(ls build/output/*.log 2>/dev/null | head -1)
          if [ -n "$log" ]; then echo "---- end of the Kaggle log (warnings left out) ----"; python kaggle/show_log.py "$log"; fi

      # Spec 016: commit the results so they're versioned and the Load results job puts them in Delta.
      # The branch starts from main, so the PR holds the results only.
      - name: Open a pull request with the results
        if: ${{ !cancelled() && inputs.open_pr && (inputs.wait || inputs.collect_only) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: kaggle-results/${{ inputs.rung }}-${{ github.run_id }}
        run: |
          pip install --quiet -e ./python   # record_results.py uses the package (pandas, the manifest code)
          git fetch --quiet --depth 1 origin main
          git worktree add --quiet -b "$BRANCH" ../results origin/main
          set +e; python kaggle/record_results.py --from build/output --to ../results/data/datasets --run-url "$RUN_URL"; rc=$?; set -e
          if [ "$rc" = 3 ]; then echo "Nothing to commit (see above)"; exit 0; fi
          [ "$rc" = 0 ] || exit "$rc"
          cd ../results
          if [ -z "$(git status --porcelain data/datasets)" ]; then echo "Results are the same as on main"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datasets
          git commit --quiet -m "Add MedGemma results from Kaggle (${{ inputs.rung }})" \
            -m "Collected by the kaggle-medgemma workflow, $RUN_URL. Synthetic review notes only. Recorded in data/datasets/results_manifest.csv; the Load results job puts them in Delta after the merge deploys."
          git push --quiet -u origin "$BRANCH"
          body="MedGemma (\`${{ inputs.rung }}\`) answers on the synthetic review notes, collected from Kaggle by $RUN_URL (spec 016).

          A pull request opened by the workflow token doesn't start CI: push a commit to this branch to run the checks before merging. After the merge, the dev deploy runs **Load results**, which appends these files to \`gold_perio_bench.fact_prediction\` and \`fact_llm_call\` with \`source_code = kaggle\`. Then \`python scripts/28_ladder_vs_truth.py && python scripts/35_readme_results.py\` refreshes the README scores."
          gh pr create --base main --head "$BRANCH" --title "Add MedGemma results from Kaggle (${{ inputs.rung }})" --body "$body" \
            || echo "::warning::Pushed $BRANCH but couldn't open the PR (Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests). Open it here: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.wait || inputs.collect_only) }}
        with:
          name: medgemma-${{ inputs.rung }}-kaggle
          path: build/output
          if-no-files-found: warn
