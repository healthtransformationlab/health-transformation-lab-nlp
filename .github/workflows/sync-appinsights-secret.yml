# Copy the Application Insights connection string from the GitHub environment `dev` into the Databricks secret scope
# (014 CHORE3, #813). The GitHub copy was set from Terraform and is proven to land (#807); the Databricks copy, used by
# every pipeline job, had not landed anything. The value goes from one secret store to the other inside this job: it
# is shape-checked, masked, and never printed, written to a file or put in a parameter.
#
# Needs: the dev environment's DATABRICKS_HOST, DATABRICKS_CLIENT_ID (variables or secrets) and DATABRICKS_CLIENT_SECRET,
# as deploy.yml; APPINSIGHTS_CONNECTION_STRING; and WRITE for the CI service principal dental-omop-ci on the scope
# health_transformation_lab (ops/secrets_register.yaml). Run it from the Actions tab after the resource is recreated.
name: Copy the Application Insights connection string to Databricks
run-name: "Copy the Application Insights connection string to Databricks"

on:
  workflow_dispatch:

concurrency: sync-appinsights-secret

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/databricks-signin
        with:
          host: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          client_id: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
          client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Check the connection string's shape (never its value)
        env:
          CS: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          [ -n "$CS" ] || { echo "::error::APPINSIGHTS_CONNECTION_STRING is not set in the dev environment"; exit 1; }
          case "$CS" in *InstrumentationKey=*IngestionEndpoint=*) ;; *)
            echo "::error::APPINSIGHTS_CONNECTION_STRING lacks InstrumentationKey= or IngestionEndpoint="; exit 1;; esac
      - name: Write it to health_transformation_lab/appinsights_connection_string
        env:
          CS: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          token=$(curl -sS --fail -u "$DATABRICKS_CLIENT_ID:$DATABRICKS_CLIENT_SECRET" \
            -d 'grant_type=client_credentials&scope=all-apis' "$DATABRICKS_HOST/oidc/v1/token" | jq -r .access_token)
          echo "::add-mask::$token"
          jq -n --arg v "$CS" '{scope: "health_transformation_lab", key: "appinsights_connection_string", string_value: $v}' \
            | curl -sS --fail-with-body -o /dev/null -w '%{http_code}\n' -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/json' --data @- "$DATABRICKS_HOST/api/2.0/secrets/put"
          curl -sS --fail -H "Authorization: Bearer $token" \
            "$DATABRICKS_HOST/api/2.0/secrets/list?scope=health_transformation_lab" \
            | jq -r '.secrets[] | select(.key == "appinsights_connection_string") | "updated \(.last_updated_timestamp / 1000 | todate)"'
