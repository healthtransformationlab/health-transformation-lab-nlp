# Run one batch of sealed tasks on a Modal GPU with the competition's evaluator loop (028 AI15, #804), from here so
# each run matches a commit. Start it from the Actions tab ("Run the Gemma agent on a Modal GPU", the run's branch in
# "Use workflow from", Run workflow), or from an agent session through GitHub's API. It is PAID, from the owner's
# Modal account.
#
# Who has to say yes (#806, ADR 0008): a run whose max_usd is within modal_auto_max_usd (ops/cost_settings.yaml), and
# that keeps this month's Modal spend within modal_auto_monthly_usd, starts on its own. Any other run, and any run when
# this month's spend cannot be read, waits in the "approve" job, in the GitHub environment modal-approval, until the
# owner approves it in Actions. That job refuses the run unless modal-approval has a required reviewer, so an
# environment GitHub makes on its own, with no rule, never lets a run through.
#
# The run's entry must be in kaggle/modal_official_run.json on that branch (never colab_official_run.json, which
# Colab sessions follow), with its bundle, its kernel_dataset and "network_open_acknowledged": true (ADR 0005), and no
# gpu (the input below chooses it). The results go to the same private Kaggle dataset a Colab run's go to.
#
# max_usd becomes Modal's time limit, at the GPU's price plus the CPU and memory at their hard limits
# (kaggle/modal_official.py), so the run cannot cost more. Before the GPU starts, the machine is checked on a CPU.
# The run is detached: cancelling this workflow does not stop it. To stop it, `modal app list`, then
# `modal app stop <app id>`. A new run waits until no earlier one is going.
#
# Needs, in the GitHub environment `dev`: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (ops/secrets_register.yaml),
# KAGGLE_USERNAME (variable or secret) and KAGGLE_API_TOKEN or KAGGLE_KEY. The environment modal-approval holds no
# secret: only its required reviewer.
name: Run the Gemma agent on a Modal GPU
run-name: "Modal: ${{ inputs.label }} on ${{ inputs.gpu }}, at most ${{ inputs.max_usd }} USD (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      label:
        description: "The run's label in kaggle/modal_official_run.json on this branch"
        required: true
      gpu:
        description: "Modal GPU (L4 is the cheapest; prices in ops/cost_settings.yaml)"
        type: choice
        options: [L4, A10, A100-40GB]
        default: L4
      max_usd:
        description: "The most this run may cost, in USD: Modal stops it when that time is up. Over 5 waits for the owner"
        default: "5"

concurrency:
  group: modal-agent   # one at a time; the "busy" step also waits out a detached run still going
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: read

defaults:
  run:
    shell: bash   # -eo pipefail: a command that fails inside a pipe fails its step

jobs:
  check:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    # Credentials come straight from the environment and are never written to a file; GitHub masks them in the log.
    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    outputs:
      gpu: ${{ steps.plan.outputs.HTL_MODAL_GPU }}
      timeout: ${{ steps.plan.outputs.HTL_MODAL_TIMEOUT }}
      needs_approval: ${{ steps.approval.outputs.needs_approval }}
      reason: ${{ steps.approval.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install --quiet "modal==1.6.4" "kaggle==2.2.5" six pyyaml   # six: kaggle 2.2.5 imports it (#536)

      - name: Check everything before Modal is called
        id: plan
        env:
          LABEL: ${{ inputs.label }}
          GPU: ${{ inputs.gpu }}
          MAX: ${{ inputs.max_usd }}
        run: python kaggle/modal_official.py preflight --label "$LABEL" --gpu "$GPU" --max-usd "$MAX" >> "$GITHUB_OUTPUT"

      - name: Kaggle accepts the credentials (one cheap call)
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          kaggle kernels list --mine --page-size 1 >/dev/null 2>err.txt || {
            head -5 err.txt; echo "::error::Kaggle rejected KAGGLE_USERNAME with KAGGLE_API_TOKEN or KAGGLE_KEY in 'dev'"; exit 1; }

      - name: Modal accepts the token (one cheap call), and when it expires
        run: |
          modal token info >info.txt 2>&1 || {
            tail -3 info.txt; echo "::error::Modal rejected MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in 'dev'"; exit 1; }
          grep -i "expires at" info.txt || echo "The Modal token has no expiry date"

      - name: Modal's own prices, for the record (the cap uses ops/cost_settings.yaml)
        run: modal billing rates --json || echo "::warning::Modal's prices could not be read"

      - name: Does this run need the owner's approval?
        id: approval
        env:
          MAX: ${{ inputs.max_usd }}
        run: |
          modal billing summary --json >summary.json 2>err.txt || { head -3 err.txt; : >summary.json; }
          python kaggle/modal_official.py approval --max-usd "$MAX" <summary.json >> "$GITHUB_OUTPUT"

  approve:
    needs: check
    if: needs.check.outputs.needs_approval == 'true'
    runs-on: ubuntu-latest
    environment: modal-approval   # its required reviewer is who approves; it holds no secret
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: "Why it waited: ${{ needs.check.outputs.reason }}"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/modal-approval" | python3 kaggle/modal_official.py gate

  run:
    needs: [check, approve]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 355
    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HTL_MODAL_GPU: ${{ needs.check.outputs.gpu }}
      HTL_MODAL_TIMEOUT: ${{ needs.check.outputs.timeout }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: pip install --quiet "modal==1.6.4" pyyaml

      - name: No earlier Modal run is still going
        run: modal app list --json | python kaggle/modal_official.py busy

      - name: Run on Modal (the machine is checked on a CPU first)
        env:
          LABEL: ${{ inputs.label }}
          GPU: ${{ inputs.gpu }}
          MAX: ${{ inputs.max_usd }}
        run: modal run --detach kaggle/modal_official.py --label "$LABEL" --gpu "$GPU" --max-usd "$MAX"
