# Deploy the bundle to Databricks dev on every merge to main, and on demand. Only dev exists today.
# uat and prod are ready but optional: a merge also tries uat, which skips until its GitHub environment has
# a secret; prod is on demand only, gated by the "prod" GitHub environment (required reviewers).
#
# Each GitHub environment (dev, uat, prod) holds the service principal's sign-in (OAuth M2M;
# databricks/setup/create_service_principal.sh makes the principal):
#   variables DATABRICKS_HOST, DATABRICKS_CLIENT_ID; secret DATABRICKS_CLIENT_SECRET
# (an older setup with HOST / CLIENT_ID as secrets still works), and variables passed to the
# bundle as BUNDLE_VAR_<name>, e.g.
#   SERVICE_PRINCIPAL, JUDGE_ENDPOINT, WAREHOUSE_NAME, USERS_GROUP
name: Deploy to Databricks dev (runs on every merge)
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "diagrams/**"]   # doc-only changes don't redeploy
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target
        type: choice
        options: [dev, uat, prod]
        default: dev
      run_benchmark:
        description: Run the study + benchmark job after deploying
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A merge deploys dev and uat (each skips without its client secret); a manual run, its one target.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.target)) || fromJSON('["dev","uat"]') }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    environment: ${{ matrix.target }}
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE_VAR_service_principal: ${{ vars.SERVICE_PRINCIPAL }}
      BUNDLE_VAR_warehouse_name: ${{ vars.WAREHOUSE_NAME || 'Serverless Starter Warehouse' }}
      BUNDLE_VAR_users_group: ${{ vars.USERS_GROUP || 'users' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/databricks-signin
        with:
          host: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          client_id: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
          client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Judge endpoint from the environment's JUDGE_ENDPOINT variable, if set (else databricks.yml's)
        if: vars.JUDGE_ENDPOINT != ''
        env:
          JUDGE_ENDPOINT: ${{ vars.JUDGE_ENDPOINT }}
        run: echo "BUNDLE_VAR_judge_endpoint=$JUDGE_ENDPOINT" >> "$GITHUB_ENV"
      - name: Stop if this environment isn't configured
        if: env.DATABRICKS_CLIENT_SECRET == ''
        run: echo "No service principal sign-in (DATABRICKS_CLIENT_SECRET) for $TARGET; skipping." && exit 0
      - uses: databricks/setup-cli@v1.3.0   # >= 0.288 for the catalogs resource; >= 1.3.0 for genie_spaces (spec 019)
        if: env.DATABRICKS_CLIENT_SECRET != ''
      - name: Python tests before deploying
        if: env.DATABRICKS_CLIENT_SECRET != ''
        run: pip install -e "./python[dev]" matplotlib && (cd python && pytest -q tests)
      - name: Validate
        if: env.DATABRICKS_CLIENT_SECRET != ''
        env: {DATABRICKS_BUNDLE_ENGINE: direct}
        run: databricks bundle validate -t "$TARGET"
      # The catalog resource deploys only with the direct engine. A target last deployed with Terraform
      # is migrated once by hand (docs/deployment.md); otherwise the deploy below fails and says so.
      # A workspace with Default Storage can't create a catalog through the API the bundle uses, so
      # health_transformation_lab is made once with SQL CREATE CATALOG (docs/deployment.md); adopt it into the bundle.
      # Already bound, or not made by hand: this fails harmlessly and the deploy below decides.
      - name: Adopt the health_transformation_lab catalog if it was made by hand (once)
        if: env.DATABRICKS_CLIENT_SECRET != ''
        env: {DATABRICKS_BUNDLE_ENGINE: direct}
        run: databricks bundle deployment bind health_transformation_lab health_transformation_lab -t "$TARGET" --auto-approve || echo "bind did not run (see above); the deploy below decides"
      # The Genie spaces are their own bundle (databricks/genie, #157). A main-bundle deploy from before that move
      # still holds them in its state, so the main bundle plans to delete them, and a deploy without a console stops
      # (issue #164). Approve that plan only when every destructive action is a Genie space; the Genie step below
      # recreates them. Any other destructive plan, or any other failure, fails here.
      - name: Deploy
        if: env.DATABRICKS_CLIENT_SECRET != ''
        env: {DATABRICKS_BUNDLE_ENGINE: direct}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/deploy.log"
          databricks bundle deploy -t "$TARGET" 2>&1 | tee "$log" && exit 0
          planned=$(grep -E '^ +(delete|recreate) resources\.' "$log" || true)
          if grep -q 'requires destructive actions' "$log" && [ -n "$planned" ] \
             && ! grep -v ' resources\.genie_spaces\.' <<<"$planned" | grep -q .; then
            echo "::notice::Removing the Genie spaces from the main bundle; the Genie step deploys them (issue #164)."
            databricks bundle deploy -t "$TARGET" --auto-approve
            exit 0
          fi
          echo "::error::Deploy failed (see above)."; exit 1
      - name: Run benchmark job
        if: env.DATABRICKS_CLIENT_SECRET != '' && github.event.inputs.run_benchmark == 'true'
        env: {DATABRICKS_BUNDLE_ENGINE: direct}
        # Returns once Databricks has started the run; follow it from the Run URL in the log.
        run: databricks bundle run -t "$TARGET" --no-wait study_benchmark
      - name: Load committed results into the gold tables (spec 016)
        if: env.DATABRICKS_CLIENT_SECRET != ''
        env: {DATABRICKS_BUNDLE_ENGINE: direct}
        # Only file versions it hasn't loaded yet; follow it from the Run URL in the log.
        run: databricks bundle run -t "$TARGET" --no-wait load_results
      - name: Load the synthetic Open Dental extract when it isn't there yet (spec 029, #369)
        if: env.DATABRICKS_CLIENT_SECRET != ''
        env: {DATABRICKS_BUNDLE_ENGINE: direct}
        # Regenerating it every deploy would spend compute for the same seeded rows, so only when bronze has no
        # patient table; after a generator change, run "Load Open Dental" by hand.
        run: |
          if databricks tables get health_transformation_lab.bronze_opendental_perio.patient >/dev/null 2>&1; then
            echo "Open Dental extract already loaded"
          else
            databricks bundle run -t "$TARGET" --no-wait open_dental_load
          fi
      - name: Genie spaces, once the tables they read exist (spec 019, issue #155)
        if: env.DATABRICKS_CLIENT_SECRET != ''
        env: {DATABRICKS_BUNDLE_ENGINE: direct}
        # A space can't be created before its tables (403), and Load results (above) writes them after the deploy.
        # So the spaces are their own bundle, deployed only when every table exists; otherwise skip, and the next
        # deploy creates them.
        run: |
          missing=$(python .github/scripts/genie_tables_missing.py)
          if [ -n "$missing" ]; then echo "::notice::Genie spaces wait for their tables: $missing"; exit 0; fi
          cd databricks/genie && databricks bundle deploy -t "$TARGET"
