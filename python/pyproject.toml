[project]
name = "health-transformation-lab-nlp"
version = "0.1.0"
description = "Synthetic dental notes -> OMOP -> periodontal status benchmark (Python side)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "opentelemetry-api>=1.25",       # pipeline telemetry (spec 014); no-op unless DENTAL_TELEMETRY is set
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
# Encoder rungs. CPU-only torch is enough for the small models on Free Edition.
models = [
  "torch>=2.2",
  "transformers>=4.44",
  "datasets>=2.19",
  "evaluate>=0.4",
  "accelerate>=0.30",
]
# LLM note readers (MedGemma, spec 004). Gemma 3 support needs transformers >= 4.50.
llm = ["torch>=2.2", "transformers>=4.50", "accelerate>=0.30"]
# LoRA fine-tuning of an LLM reader (scripts/17_medgemma_lora.py). GPU strongly advised.
lora = ["torch>=2.2", "transformers>=4.50", "accelerate>=0.30", "peft>=0.11", "trl>=0.12", "datasets>=2.19"]
# Load OMOP into Postgres / Lakebase (health_transformation_lab_nlp/db.py, scripts/05_load_omop_db.py)
db = ["sqlalchemy>=2", "psycopg[binary]>=3.1"]
# Experiment tracking; on Databricks the workspace MLflow is used instead.
track = ["mlflow>=3.4"]                 # tracking, UC registry, GenAI judges (make_judge)
# Mixed models on real (unbalanced) charts: reliability_cal.reml_components (spec 013 G5)
stats = ["statsmodels>=0.14"]
# Status classifier with SHAP explanations (spec 013 G10): exact TreeSHAP comes with xgboost
ml = ["xgboost>=2.0"]
# Telemetry backends (spec 014): Azure Application Insights, or any OTLP endpoint
azure = ["azure-monitor-opentelemetry>=1.6"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "ruff>=0.5", "duckdb>=1.0"]   # duckdb runs the dashboards' SQL in tests (spec 019)
# PerioBench as a Kaggle Benchmarks task (health_transformation_lab_nlp.kbench, kaggle/perio_bench_task.py)
kbench = ["kaggle-benchmarks>=0.6", "pydantic>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
health_transformation_lab_nlp = ["*.yaml"]   # telemetry_levels.yaml

[tool.setuptools.packages.find]
where = ["."]
include = ["health_transformation_lab_nlp*"]

[tool.ruff]
line-length = 100
