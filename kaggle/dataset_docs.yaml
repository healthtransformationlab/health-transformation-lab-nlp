# What every file and column in our Kaggle datasets holds (spec 034 US1, #533). kaggle/publish.py and
# kaggle/publish_tasks.py send it with each publish; python/tests/test_kaggle_dataset_docs.py fails when a published
# file or column has no entry. Describe what the data holds, as the code makes it: never more than it shows.
#
# datasets.<slug>.files: a description per file; keys are paths in the dataset, `*` matches within a name.
#   A file entry may name `other_columns`: the description for columns named after a method or a status.
#   file_columns: {path pattern: {column: description}} for a column whose shared name means something else in
#   that file (an LLM's `grade` is its answer, not the truth); these win over the shared description.
# columns: one description per column name, shared across files (same name, same meaning).

repository: https://github.com/healthtransformationlab/health-transformation-lab-nlp

datasets:
  perio-bench-notes:
    update_frequency: monthly
    sources: >-
      Generated by python/scripts/10_build_study.py (seed 42, 1,200 synthetic people, 8 synthetic clinics) in
      https://github.com/healthtransformationlab/health-transformation-lab-nlp. Periodontal status follows the
      2017 AAP/EFP classification (Tonetti, Greenwell & Kornman, J Periodontol 2018). Smoking and diabetes shares
      follow published US figures (docs/synthetic_data.md). No real patient, clinic or record.
    files:
      train.csv: >-
        Training notes: one synthetic dental chart note per visit outside the review set, with the chart's true
        periodontal status, grade and extent, the status the note states, and radiograph features.
      visits_structured.csv: >-
        Every synthetic visit's structured record: patient, clinic, visit order and date, risk factors, the
        recorded chart measurements, and the status each evidence source in the record supports.
      review_key.csv: >-
        Answer key for the 223 review notes: the true status, grade and extent, the note's style and difficulty,
        what each evidence source supports, and what two rule-based readings decided. Score models here; don't
        train on it.
      visits_truth.csv: >-
        Each visit's true chart (the generator's truth), with any charting error injected into its record.
      clinic_profiles.csv: >-
        The 8 synthetic clinics: case mix, how often they chart probing, and how many patients they see.
      review_tasks.json: >-
        The 223 review notes as Label Studio tasks, to load the review set for human chart review.
  perio-bench-results:
    update_frequency: monthly
    sources: >-
      Each model's answers on the 223 synthetic review notes of the perio-bench-notes dataset, from
      python/scripts/11_ai_predict.py (one run per model) in
      https://github.com/healthtransformationlab/health-transformation-lab-nlp; the leaderboard files from
      28_ladder_vs_truth.py. Scores are measured against the generator's truth on synthetic notes, not evidence
      about any model or product. Simulated dry runs are left out.
    files:
      "ai_predictions_*.csv": >-
        One model's answers: the predicted periodontal status for each of the 223 review notes and, where the
        model gives them, its probability for each status. The file name names the method.
      "llm_details_*.csv": >-
        An LLM reader's raw answer for each review note, with the quoted evidence, the quote check, tokens and
        latency. The file name names the method.
      "judge/*.csv": >-
        An LLM judge's reading of the same charts, and the metrics computed against it (judge scorecard).
      ladder/ladder_vs_truth.csv: >-
        The leaderboard: each method's accuracy against the truth with a 95% bootstrap interval, stage IV recall,
        harm rates, calibration error and the paired difference from the note_rules reference.
      ladder/ladder_by_age.csv: Each method's accuracy within each age band of the review notes.
      ladder/ladder_by_clinic.csv: Each method's accuracy within each synthetic clinic.
      ladder/ladder_by_stageable.csv: >-
        Each method's accuracy on notes whose chart can and cannot be staged from what the note records.
      ladder/ladder_pending.csv: >-
        Prediction files left off the leaderboard because they were made on an older version of the review notes
        (their note-set hash differs from the current one).
      ladder/ladder_preds.csv: >-
        Every method's predicted status for each review note, with healthy and gingivitis merged into one class
        (healthy_or_gingivitis), beside the truth.
      ladder/ladder_proba.csv: >-
        Each method's probability for each status (healthy and gingivitis merged), one row per method and review
        note, for the methods that give probabilities.
      ladder/medgemma_field_accuracy.csv: >-
        Each MedGemma run's agreement with the answer key on each field it answers (status, grade, extent), with a
        95% Wilson interval; grade and extent are scored only on the review notes whose truth has them.
      ladder/medgemma_vs_bert.csv: >-
        Each MedGemma reader run beside every fine-tuned encoder on the same review notes: accuracy with a 95%
        bootstrap interval, the paired difference from the most accurate encoder, stage IV recall, harm rates, the
        reader's quote-check and fallback rates, tokens, and an illustrative cost of reading a whole corpus.
      ladder/medgemma_vs_bert_by_difficulty.csv: >-
        The same methods' accuracy at each note difficulty level (L1 plain to L3 hard).
      ladder/medgemma_vs_bert_preds.csv: >-
        The predictions those two files score: one row per review note, one column per method, beside the truth and
        the note's difficulty (healthy and gingivitis merged).
      ladder/seed_stability.csv: >-
        Each method's accuracy on the review notes of the synthetic study rebuilt with each of five seeds (42, 1, 2,
        3, 4), for the methods that need no GPU: do the scores hold on other draws?
      ladder/seed_stability_summary.csv: Each method's accuracy across those five seeds - mean, spread and range.
    other_columns:
      ladder/ladder_preds.csv: a method's predicted status for this note (healthy and gingivitis merged); the column names the method
      ladder/medgemma_vs_bert_preds.csv: a method's predicted status for this note (healthy and gingivitis merged); the column names the method
    file_columns:
      "llm_details_*.csv":
        status: The periodontal status the model answered, as parsed from its reply.
        grade: The periodontitis grade the model answered (A, B or C); NA when it answered none.
        extent: The extent the model answered (localized, generalized or molar_incisor); NA when it answered none.
      ladder/medgemma_field_accuracy.csv:
        n: Number of review notes scored on this field.
        accuracy: Share of those notes where the model's answer matches the answer key (0-1).
      ladder/medgemma_vs_bert.csv:
        fallback: Share of notes where the quote gate failed and the keyword rules answered instead (0-1).
  health-transformation-lab-coding-agent-tasks:
    update_frequency: monthly
    sources: >-
      Mined from the merged pull requests and commits of
      https://github.com/healthtransformationlab/health-transformation-lab-nlp by python/scripts/46_mine_tasks.py
      and 55_build_tasks.py, gated by 57_gate_tasks.py, and published by .github/workflows/kaggle-publish-tasks.yml
      (spec 028). The layout follows the Gemma 4 Developer Agent competition's dataset. Embeddings made with
      google/embeddinggemma-300m. Not affiliated with Kaggle, Google or the competition's organisers.
    files:
      tasks.jsonl: >-
        One coding task per line: a real change from the repository's history, with the text written at the time,
        the code patch and the test patch. Only tasks whose tests fail without the fix and pass with it.
      tasks_excluded.csv: Candidate tasks left out of the set, and why.
      task_gates.csv: >-
        The gate result for every candidate: whether its tests fail without the fix and pass with it, in this
        repository's Python 3.13 environment.
      swegemma_verification.csv: >-
        The competition's own evaluator (swegemma) on each task: whether it resolves the reference patch, an empty
        patch, and a saved agent patch. Only tasks whose reference patch it resolves and whose empty patch it does
        not are in the set.
      "snapshots/*.tgz": >-
        The repository at the task's base commit as a single commit on main, files and .git at the archive root,
        no later history. Text naming one organisation the repository's rules forbid reads [org], a folder of
        course files without a stated licence is withheld, and one file is added: a root conftest.py that puts
        python/ on the import path, so the competition's evaluator can import the package.
      "graphs/*.json": >-
        A code graph of the package at a base commit: NetworkX node-link JSON, one node per module, class and
        function with its source text, and calls edges. Named <repo name>_<base_commit>, as the competition's.
      "embeddings/*.npz": >-
        One 256-dimension float32 vector per graph node, keyed by node id (EmbeddingGemma, cut from 768 dimensions
        and renormalised). Named <repo name>_<base_commit>, as the competition's.
    file_columns:
      swegemma_verification.csv:
        reason_text: Why the evaluator did not resolve the task with that patch; empty when it did.

columns:
  # people, visits, clinics
  visit_id: Synthetic visit's id; joins the notes, the structured record, the truth and every prediction file.
  person_id: Synthetic patient's id (1-1,200).
  clinic_id: Synthetic clinic's id (1-8).
  clinic_code: Synthetic clinic's id (1-8), as a label.
  visit_seq: Order of the visit within the patient's visits, 0 for the first (recalls about 6 months apart).
  visit_date: Date of the synthetic visit.
  age: Patient's age in years at the visit.
  age_code: Age band of the review notes (for example 35_64).
  charted: True when probing was charted at this visit; when false, the record has no probing chart.
  treated_before: True when the patient had periodontal therapy at an earlier visit.
  cigarettes_per_day: Cigarettes smoked per day (0 for non-smokers), a grade modifier.
  diabetes: True when the patient has diabetes, a grade modifier.
  hba1c: HbA1c (%) when the patient has diabetes; empty otherwise.
  case_mix: How much the clinic's patients lean toward more severe disease (negative is healthier), from -0.08 to 0.10.
  charted_share: Share of the clinic's visits with a probing chart (0.6-0.95).
  patient_weight: The clinic's relative share of patients (0.5-1.5) when patients are assigned to clinics.
  in_review: True when the visit is one of the 223 review notes.

  # measurements: recorded (rec_) and true
  rec_max_probing_depth_mm: Deepest probing depth recorded at the visit, in mm; empty when not charted.
  rec_bop_pct: Share of sites recorded as bleeding on probing, in percent; empty when not charted.
  rec_max_cal_mm: Greatest clinical attachment loss recorded, in mm; empty when not charted.
  rec_rbl_pct: Radiographic bone loss recorded, as a percent of root length; empty when not charted.
  rec_teeth_lost_perio: Teeth recorded as lost to periodontitis; empty when not charted.
  rec_pct_teeth_involved: Percent of teeth recorded with periodontal involvement (the basis for extent); empty when not charted.
  max_cal_mm: Greatest clinical attachment loss on the true chart, in mm.
  rbl_pct: Radiographic bone loss on the true chart, as a percent of root length.
  teeth_lost_perio: Teeth lost to periodontitis on the true chart.
  record_error: The charting error injected into this visit's record, if any (wrong_patient_chart or decimal_slip); the truth is unchanged.

  # labels and truth
  label: The chart's true periodontal status (healthy, gingivitis, periodontitis_stage_1 to periodontitis_stage_4), from the generator.
  label_source: Where the label comes from (generator, the synthetic chart).
  grade: True periodontitis grade (A, B or C); NA when not periodontitis.
  extent: True extent (localized, generalized or molar_incisor); NA when not periodontitis.
  truth: The true status for this note, with healthy and gingivitis merged (healthy_or_gingivitis).
  truth_status: The true periodontal status from the generator's chart.
  truth_grade: True periodontitis grade (A, B or C); NA when not periodontitis.
  truth_extent: True extent (localized, generalized or molar_incisor); NA when not periodontitis.
  stated_status: The status the note's written diagnosis line states, which can differ from the chart.

  # the note
  note_text: The synthetic chart note, with fake identifiers replaced by placeholders such as [NAME] and [DATE].
  style: The note's writing style - ehr, soap, chart_summary or narrative.
  numeric: True when the note gives probing measurements as numbers.
  dx_scheme: Where the written diagnosis line's wording comes from - catalogue (the published pattern catalogue), 2017 (the 2017 classification), old (pre-2017 terms) or none.
  dx_pattern: How the written diagnosis line is phrased (for example health_title, or none when the note has none).
  difficulty: Review difficulty, L1 (easy) to L3 (hard), from the phrasing, copy-forward and any mismatch with the chart.
  copy_forward: True when the note copies text forward from an earlier visit.
  radiograph_summary: A one-line summary of the visit's radiograph, or that there was none.

  # evidence sources: the status each part of the record supports
  notes: Status the note text supports.
  exam_form: Status the periodontal exam form supports.
  proc_codes_completed: Status the completed procedure codes support.
  proc_codes_planned: Status the planned procedure codes support.
  proc_dx_completed: Status the diagnosis codes on completed procedures support.
  proc_dx_planned: Status the diagnosis codes on planned procedures support.
  probing_chart: Status the recorded probing chart supports (unknown when not charted).
  radiograph_ai: Status the radiograph AI's findings support (unknown when no radiograph).
  algorithm_v0: Status a rule-based reading of the whole record decides, gum measurements first.
  algorithm_design: Status the same rules decide taking the sources in the study design's order.
  algorithm_v0_decided_by: The evidence source algorithm_v0 took its answer from.
  algorithm_design_decided_by: The evidence source algorithm_design took its answer from.

  # radiograph features
  rad_present: 1 when the visit has a radiograph, 0 otherwise.
  rad_max_rbl_pct: Greatest radiographic bone loss on the radiograph, as a percent of root length.
  rad_mean_rbl_pct: Mean radiographic bone loss across teeth, as a percent of root length.
  rad_share_teeth_rbl15: Share of teeth with at least 15% radiographic bone loss (0-1).
  rad_vertical_defects: Number of vertical bone defects seen.
  rad_furcations: Number of furcation involvements seen.
  rad_calculus_teeth: Number of teeth with calculus seen.
  rad_missing_teeth: Number of missing teeth seen.
  rad_is_bwx: 1 when the radiograph is a bitewing series, 0 otherwise.

  # predictions
  pred: The method's predicted periodontal status for this review note.
  p_healthy: The method's probability that the status is healthy.
  p_gingivitis: The method's probability that the status is gingivitis.
  p_periodontitis_stage_1: The method's probability of periodontitis stage I.
  p_periodontitis_stage_2: The method's probability of periodontitis stage II.
  p_periodontitis_stage_3: The method's probability of periodontitis stage III.
  p_periodontitis_stage_4: The method's probability of periodontitis stage IV.
  healthy_or_gingivitis: Probability that the status is healthy or gingivitis (merged).
  periodontitis_stage_1: Probability of periodontitis stage I.
  periodontitis_stage_2: Probability of periodontitis stage II.
  periodontitis_stage_3: Probability of periodontitis stage III.
  periodontitis_stage_4: Probability of periodontitis stage IV.

  # LLM reader details (llm_details_*.csv; see also file_columns)
  model: The model id the reader ran (for example medgemma-4b-it).
  backend: How the model was run - hf (local weights) or openai (an OpenAI-compatible endpoint).
  revision: The Kaggle Models handle or Hugging Face commit of the weights; empty for runs before it was recorded.
  prompt_version: The reader prompt's version (for example reader-v2).
  shots: Number of few-shot examples in the prompt.
  input_tokens: Prompt tokens for the call.
  output_tokens: Completion tokens for the call.
  latency_s: Seconds the call took.
  raw: The model's full reply, as returned.
  quote: The passage the model quoted from the note as its evidence.
  gate_ok: True when the quote gate passed (the quote appears verbatim in the note).
  error: The call or parse error, if any; empty otherwise.
  fallback: True when the quote gate failed and the keyword rules answered instead.

  # MedGemma field accuracy (ladder/medgemma_field_accuracy.csv)
  run: The MedGemma run the row scores (the model id).
  field: The field scored - status, grade or extent.
  correct: Number of notes where the model's answer for the field matches the answer key.
  ci_lo: Lower end of the 95% Wilson interval for the field's accuracy.
  ci_hi: Upper end of the 95% Wilson interval for the field's accuracy.

  # MedGemma vs the encoders (ladder/medgemma_vs_bert.csv)
  kind: What kind of method the row is (llm for a note reader, encoder for a fine-tuned model, rules).
  reference: The encoder the paired difference is measured against (the most accurate encoder alone).
  gate_pass: Share of notes whose answer passed the quote gate (0-1); empty for methods that don't quote.
  input_tokens_mean: Mean prompt tokens per note.
  output_tokens_mean: Mean completion tokens per note.
  latency_s_mean: Mean seconds per call.
  notes_per_sec: Notes read per second, an assumed throughput from costs.yaml (not measured in this run).
  throughput_source: Where the assumed throughput comes from.
  corpus_usd_illustrative: >-
    An illustrative cost, in US dollars, of reading the corpus size in costs.yaml at that throughput on the assumed
    hardware: an example from assumptions, not a quote or a bill.

  # leaderboard
  method: The method (model or rule set) the row describes.
  method_name: The method the prediction file is for.
  n: Number of review notes in the group.
  accuracy: Share of review notes whose predicted status matches the truth (0-1).
  acc_lo: Lower end of the 95% bootstrap interval for accuracy.
  acc_hi: Upper end of the 95% bootstrap interval for accuracy.
  stage4_recall: Share of stage IV charts the method called stage IV.
  unsafe_rate: Share of notes the method gave a status where its error could cause harm (S1 or S2 in harm.py's severity matrix, a draft pending a periodontist's sign-off).
  s2_rate: Share of notes the method gave a status where its error risks irreversible harm (S2, a missed stage III or IV), under the same draft matrix.
  ece: Expected calibration error of the method's probabilities; empty when it gives none.
  diff_vs_ref: Accuracy minus the reference method's (note_rules), on the same notes.
  diff_lo: Lower end of the 95% paired bootstrap interval for diff_vs_ref.
  diff_hi: Upper end of the 95% paired bootstrap interval for diff_vs_ref.
  stageable_code: Whether the note's chart can be staged from what the note records (stageable or not_stageable).
  seed: The seed the synthetic study was rebuilt with.
  seed_count: Number of seeds the method was scored on.
  mean_accuracy: Mean accuracy across seeds.
  sd_accuracy: Standard deviation of accuracy across seeds.
  min_accuracy: Lowest accuracy across seeds.
  max_accuracy: Highest accuracy across seeds.
  file_name: The prediction file's name.
  source_name: Where the prediction file came from (repo, kaggle or databricks).
  run_url: Link to the run that made the file, when there is one.
  note_set_sha256: Hash of the review notes the file was made on.
  current_note_set_sha256: Hash of the current review notes; a file whose hash differs is pending.

  # task set (tasks.jsonl, the competition's fields)
  instance_id: The task's id (htlnlp_<pr or commit>).
  repo: The repository the task comes from (owner/name).
  base_commit: The commit the task starts from; the snapshot holds the repository at this commit.
  patch: The fix as a unified diff, test files excluded.
  test_patch: The tests that came with the fix, as a unified diff of python/tests/.
  problem_statement: The task's text as written at the time (issue, pull request or commit message, by fidelity tier).
  hints_text: Further text from the time (the pull request and its review), when there is one.
  created_at: When the issue, pull request or commit was created (UTC).

  # task set (swegemma_verification.csv: the competition's evaluator)
  patch_source_code: Which patch was verified - reference (the task's own fix), empty (no change) or a model's name.
  is_resolved: True when the competition's evaluator counts the task as resolved with that patch.
  test_exit_code: pytest's exit code in the evaluator's verification (0 passed, 1 tests failed, 2 collection error).
  verify_seconds: Seconds the verification of that patch took.
  evaluator_name: The evaluator and version that gave the verdict.
  snapshot_code: Which snapshot files were verified (the published ones, with or without the added conftest.py).
  run_ts: When the verification was run (UTC).

  # task set (tasks_excluded.csv, task_gates.csv)
  tier_code: Fidelity tier of the task's text, A (issue), B (pull request) or C (commit message).
  reason_text: Why the task was left out, or why it failed the gate.
  target_count: Number of test files the task's test patch touches (the tests the gate runs).
  fail_before: True when the target tests fail with the test patch alone, without the fix.
  pass_after: True when the target tests pass with the fix and the test patch.
  is_valid: True when the task passes both gates, so it is in the set.
  before_exit_code: pytest's exit code without the fix.
  after_exit_code: pytest's exit code with the fix.
  after_passed_count: Tests passed with the fix.
  after_failed_count: Tests failed with the fix.
  after_error_count: Tests in error with the fix.
  stripped_paths_text: Files removed from the patch before the gate, because the grader strips them (for example pyproject.toml).
  before_seconds: Seconds the run without the fix took.
  after_seconds: Seconds the run with the fix took.
