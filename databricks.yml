# Databricks Asset Bundle: deploys the notebooks as jobs to dev, uat and prod.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev            # the dev workspace, same names as uat/prod
#   databricks bundle run      -t dev study_benchmark
#
# uat and prod are deployed by CI (.github/workflows/deploy.yml) as a service
# principal. Per-environment settings are variables below; override any of them
# with --var name=value or BUNDLE_VAR_<name>. Guide: docs/deployment.md.
#
# Personal learning project; synthetic data only in every target until the
# real-data path is approved. See DISCLAIMER.md.

bundle:
  name: health-transformation-lab-nlp

include:
  - databricks/resources/*.yml

variables:
  # dev, uat and prod are separate workspaces, so the names are the same in every
  # target: catalog health_transformation_lab, schemas <layer>_<bench> (spec 022: perio_bench, oral_health_bench,
  # access_bench; databricks/resources/unity_catalog.yml).
  catalog:
    description: Unity Catalog catalog the bundle creates
    default: health_transformation_lab
  legacy_domain:
    description: Suffix of the old layer schemas dev keeps until retired (spec 022; docs/deployment.md)
    default: dental_omop_perio
  legacy_gold_schemas:
    description: Old gold schemas (catalog.schema, comma-separated) whose rows Load results' first task carries into gold_perio_bench; missing ones are skipped (issue #228)
    default: dental_omop.gold_dental_omop_perio,health_transformation_lab.gold_dental_omop_perio
  n_people:
    description: Synthetic people to generate in the benchmark job
    default: "300"
  run_encoder:
    description: Fine-tune the DistilBERT rung in the benchmark job (installs CPU torch; adds ~10 min)
    default: "false"
  judge_endpoint:
    description: Model Serving endpoint for the LLM judge (approved for de-identified data)
    default: none
  judge_usd_per_million_in:
    description: Judge endpoint list price, US$ per 1M input tokens (Llama 3.3 70B pay-per-token 7.143 DBU x US$0.07; check your account's rate)
    default: "0.50"
  judge_usd_per_million_out:
    description: Judge endpoint list price, US$ per 1M output tokens (21.429 DBU x US$0.07)
    default: "1.50"
  judge_max_usd:
    description: Budget per run, US$, for judge endpoint calls; the judge scorecard stops above it and the pipeline doctor's root-cause rung shares it (spec 027 US5)
    default: "5"
  doctor_lookback_days:
    description: Days of job runs the pipeline doctor diagnoses on each run (1-30; it reads 60 days for the trailing ok runs)
    default: "7"
  doctor_span_table:
    description: Unity Catalog table (catalog.schema.table) holding the span export, one row per run in fact_pipeline_run's columns; none = job run timeline only
    default: none
  judge_sample_rate:
    description: Share of live traces the LLM judges score in production monitoring (the PHI scan scores all)
    default: "0.1"
  warehouse_name:
    description: SQL warehouse that runs the ai_query judge notebook
    default: Serverless Starter Warehouse
  warehouse_id:
    description: Looked up from warehouse_name
    lookup:
      warehouse: ${var.warehouse_name}
  reader_rung:
    description: LLM note-reader rung from models.yaml
    default: medgemma-1.5-4b-it
  reader_limit:
    description: Review notes the reader job processes (0 = all)
    default: "40"
  reader_shots:
    description: Few-shot examples per status in the MedGemma reader's prompt (0 = zero-shot)
    default: "0"
  reader_lora_train:
    description: LoRA fine-tune MedGemma on this many training notes first (0 = no fine-tune)
    default: "0"
  deid_ai_engines:
    description: De-identification methods the De-id AI methods job runs (the ones that need Databricks services)
    default: llm,llm+regex_v2+guard,ai_mask,ai_mask+regex_v2+guard
  deid_llm_endpoint:
    description: Pay-per-token chat endpoint for the llm de-identification method
    default: databricks-meta-llama-3-3-70b-instruct
  hf_secret_scope:
    description: Secret scope holding hf_token (Hugging Face read token; HAI-DEF terms accepted)
    default: health_transformation_lab
  telemetry_exporter:
    description: "Pipeline telemetry (spec 014): azure (Application Insights; connection string from secret health_transformation_lab/appinsights_connection_string, off if missing), otlp, console or off"
    default: azure
  lakebase_instance:
    description: Lakebase (managed Postgres) instance or project for this environment
    default: dental-dev
  lakebase_database:
    description: Postgres database inside the Lakebase instance
    default: databricks_postgres
  lakebase_schema:
    description: Schema for the OMOP CDM + dental extension in Lakebase
    default: cdm_dev
  gpu_accelerator:
    description: Serverless GPU for the GPU jobs (MedGemma reader, encoders); Free Edition offers A10
    default: GPU_1xA10
  gpu_environment_version:
    description: Serverless environment version for the GPU jobs (a task with task-level compute needs one)
    default: "4"
  encoder_gpu_rungs:
    description: Encoders the GPU job fine-tunes (spec 002 T017)
    default: modernbert-large,bioclinical-modernbert-large,longformer-base,clinical-longformer,gatortron-base
  encoder_gpu_lr:
    description: Learning-rate overrides for the GPU job, rung=rate (GatorTron-base diverged at 5e-5 on CPU)
    default: gatortron-base=2e-5
  service_principal:
    description: Application id of the service principal that runs uat/prod jobs
    default: "00000000-0000-0000-0000-000000000000"
  users_group:
    description: Workspace group that may view and run the jobs
    default: users

targets:
  # The dev workspace (e.g. Databricks Free Edition). Not `mode: development`: that
  # prefixes every name ([dev <user>] jobs, dev_<user>_ catalogs and schemas), and
  # the workspace already separates environments. Names are the same in every
  # target. Schedules stay paused; everything is serverless.
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
    variables:
      judge_endpoint: databricks-meta-llama-3-3-70b-instruct   # pay-per-token; synthetic, de-identified notes only
    resources:
      catalogs:
        health_transformation_lab:
          # dev has Default Storage: the catalog was made with SQL and adopted (docs/deployment.md), which
          # gives it the workspace's default storage root. Stating it keeps the plan from recreating the catalog.
          storage_root: s3://dbstorage-prod-ast0p/uc/556de223-f832-4c59-8269-f8bebde9a978/71a2bfe2-25ec-4dde-ad73-b6f34409fcef
      # Spec 022: the old <layer>_dental_omop_perio schemas, their volume and model, which dev deployed under
      # spec 021 (uat and prod never did). They keep their bundle keys so a deploy neither fails on
      # prevent_destroy nor drops them; retire them by hand (docs/deployment.md).
      schemas:
        landing:
          catalog_name: ${resources.catalogs.health_transformation_lab.name}
          name: landing_${var.legacy_domain}
          comment: Legacy (spec 022), replaced by landing_perio_bench. Synthetic data only.
          lifecycle:
            prevent_destroy: true
        bronze:
          catalog_name: ${resources.catalogs.health_transformation_lab.name}
          name: bronze_${var.legacy_domain}
          comment: Legacy (spec 022), replaced by bronze_perio_bench. Synthetic data only.
          lifecycle:
            prevent_destroy: true
        silver:
          catalog_name: ${resources.catalogs.health_transformation_lab.name}
          name: silver_${var.legacy_domain}
          comment: Legacy (spec 022), replaced by silver_perio_bench. Synthetic data only.
          lifecycle:
            prevent_destroy: true
        gold:
          catalog_name: ${resources.catalogs.health_transformation_lab.name}
          name: gold_${var.legacy_domain}
          comment: Legacy (spec 022), replaced by gold_perio_bench. Synthetic data only.
          lifecycle:
            prevent_destroy: true
      volumes:
        data:
          catalog_name: ${resources.schemas.landing.catalog_name}
          schema_name: ${resources.schemas.landing.name}
          name: data
          volume_type: MANAGED
          comment: Legacy (spec 022), replaced by landing_perio_bench.data. Synthetic data only.
          lifecycle:
            prevent_destroy: true
      registered_models:
        perio_note_classifier:
          name: perio_note_classifier
          catalog_name: ${resources.schemas.gold.catalog_name}
          schema_name: ${resources.schemas.gold.name}
          comment: Legacy (spec 022), replaced by gold_perio_bench.perio_note_classifier. Synthetic data only.

  # Shared test environment. Deployed by CI from main, runs as the service principal.
  uat:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
    variables:
      n_people: "1500"
      run_encoder: "true"
      lakebase_instance: dental-uat
      lakebase_schema: cdm
    permissions:
      - group_name: ${var.users_group}
        level: CAN_VIEW
    resources:
      jobs:
        judge_monitoring: &judge_monitoring_job
          name: Judge monitoring
          tags:
            project: health-transformation-lab-nlp
            data: synthetic
            git_commit: ${bundle.git.commit}   # the commit this job was deployed from
          tasks:
            - task_key: start_monitoring
              notebook_task:
                notebook_path: databricks/notebooks/05_judge_monitoring.py
                base_parameters:
                  git_commit: ${bundle.git.commit}   # shown on every run
                  judge_endpoint: ${var.judge_endpoint}
                  experiment_id: ${resources.experiments.dental_experiment.id}
                  sample_rate: ${var.judge_sample_rate}

  # Production. Manual deploy from a tagged commit, approval required in CI.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
    variables:
      run_encoder: "true"
      lakebase_instance: dental-prod
      lakebase_schema: cdm
      n_people: "1500"
      reader_limit: "0"
    permissions:
      - group_name: ${var.users_group}
        level: CAN_VIEW
    resources:
      jobs:
        judge_monitoring: *judge_monitoring_job
